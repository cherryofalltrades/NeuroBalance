<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeuroBalance — Mobile wireframe</title>
<style>
:root{--ink:#202b38;--muted:#667383;--line:#dbe2e8;--paper:#f6f8fa;--white:#fff;--navy:#243447;--teal:#7dc9bd;--teal-dark:#246b65;--lav:#ebe8fa;--peach:#f8e7d8;--blue:#e4eff9;--green:#e4f2eb;--amber:#f7eed5;--shadow:0 20px 55px #17253418}*{box-sizing:border-box}body{margin:0;background:#edf1f3;color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{font-weight:750;letter-spacing:-.03em;font-size:18px}.brand b{color:#348c7e}.top small{color:var(--muted)}.shell{max-width:1440px;margin:auto;padding:24px;display:grid;grid-template-columns:220px minmax(320px,410px) minmax(280px,1fr);gap:24px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.nav{padding:18px 12px;position:sticky;top:18px}.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#778494;font-weight:750;margin:6px 10px 12px}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:10px;font:inherit;color:#455363;display:flex;gap:10px;align-items:center;margin:2px 0;cursor:pointer}.nav button.active{background:#e8f4f1;color:#246b65;font-weight:700}.nav button:hover{background:#f1f5f5}.num{font-size:10px;border:1px solid #d9e1e3;border-radius:6px;width:22px;height:22px;display:grid;place-items:center}.phone-wrap{display:flex;justify-content:center}.phone{width:100%;max-width:375px;height:min(790px,calc(100vh - 115px));min-height:630px;background:#fbfcfd;border:9px solid #1f2a35;border-radius:38px;box-shadow:0 22px 50px #0d1b2926;overflow:hidden;position:relative;display:flex;flex-direction:column}.status{height:28px;display:flex;justify-content:space-between;padding:5px 17px 0;font-size:10px;font-weight:700;background:#fff}.appbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 19px;background:#fff;border-bottom:1px solid #edf0f2}.appbar strong{font-size:15px}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:50%;width:32px;height:32px;color:#536171;font-size:15px}.content{padding:20px 18px 16px;overflow:auto;flex:1}.hello{font-size:12px;color:var(--muted);margin:0 0 4px}.title{font-size:25px;line-height:1.14;letter-spacing:-.035em;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 17px;font-size:12px}.card{background:#fff;border:1px solid #e1e7eb;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 3px 12px #1b31420a}.card.tint{background:#f0f7f5;border-color:#dfefeb}.card.lav{background:#f5f3fc}.card.peach{background:#fdf5ef}.card.blue{background:#f2f7fb}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.label{font-weight:700;font-size:13px}.small{font-size:11px;color:var(--muted)}.badge{display:inline-flex;background:#e4f2eb;color:#346c59;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:700}.btn{border:0;border-radius:12px;padding:12px 15px;background:#2d776e;color:#fff;font:700 12px inherit;cursor:pointer;width:100%;margin-top:9px}.btn.secondary{background:#edf4f2;color:#28675f;border:1px solid #d8e9e4}.btn.ghost{background:#fff;color:#536171;border:1px solid var(--line)}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #dce3e7;border-radius:99px;background:#fff;padding:7px 10px;font-size:11px;color:#536171}.chip.on{background:#e6f3f0;border-color:#a9d6cb;color:#246b65}.progress{height:7px;background:#e9eef0;border-radius:10px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:#66b9aa;border-radius:10px}.bottom{height:61px;background:#fff;border-top:1px solid #e6ebee;display:flex;justify-content:space-around;align-items:center}.bottom button{border:0;background:none;color:#85909b;font-size:9px;display:grid;gap:3px;justify-items:center}.bottom button b{font-size:17px;font-weight:500}.bottom button.sel{color:#2d776e}.brain{height:155px;border-radius:15px;background:radial-gradient(ellipse at 47% 45%,#fbfcff 0%,#f1f2fa 58%,#eceef8 100%);display:flex;align-items:center;justify-content:center;position:relative;margin:12px 0 8px}.brain svg{width:170px;height:130px}.brain-note{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:9px;color:#667383}.goal{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #edf0f2}.goal:first-of-type{border-top:0}.dot{width:29px;height:29px;border-radius:10px;background:#e8f2ef;display:grid;place-items:center;font-size:14px}.goalcopy{flex:1}.goalcopy b{font-size:11px;display:block}.goalcopy span{font-size:10px;color:var(--muted)}.check{width:20px;height:20px;border:1px solid #c9d7d5;border-radius:7px;background:#fff;color:#2d776e}.stepper{display:flex;gap:6px;margin:14px 0}.stepper i{height:4px;flex:1;background:#e4e9eb;border-radius:8px}.stepper i.on{background:#56a99b}.choice{display:flex;gap:9px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff}.choice .tick{width:19px;height:19px;border:1px solid #c5d1d5;border-radius:6px}.choice.sel .tick{background:#31796e;border-color:#31796e;color:#fff;text-align:center;font-size:13px}.choice strong{display:block;font-size:12px}.choice span{font-size:10px;color:var(--muted)}.timer{font-size:51px;letter-spacing:-.04em;text-align:center;font-weight:650;margin:15px 0 4px}.ring{width:156px;height:156px;border-radius:50%;border:8px solid #e0efeb;border-top-color:#68b7a8;margin:20px auto;display:grid;place-items:center}.ring span{font-size:12px;color:var(--muted)}.slider{height:8px;border-radius:9px;background:linear-gradient(90deg,#83c7b8 60%,#e6ecee 60%);margin:16px 0}.flash{padding:24px 16px;background:#f5f3fc;border-radius:14px;text-align:center;margin:16px 0}.flash b{font-size:16px}.flash p{font-size:12px;color:var(--muted)}.breath{width:146px;height:146px;border-radius:50%;background:#e6f2f1;border:1px solid #cce5df;margin:19px auto;display:grid;place-items:center;text-align:center;color:#286d64;font-weight:700}.week{display:flex;justify-content:space-between;margin:12px 0}.day{width:34px;height:43px;border-radius:11px;background:#edf4f2;display:grid;place-items:center;font-size:10px;color:#537269}.day.done{background:#d7ece3;color:#286d64}.rating{display:flex;gap:7px}.rating button{flex:1;padding:10px 3px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:10px;color:#536171}.rating button.selected{background:#e4f2eb;border-color:#8fc6b8;color:#276d62}.inspect{padding:22px;position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}.inspect h2{font-size:20px;margin:4px 0 4px;letter-spacing:-.02em}.inspect .desc{color:var(--muted);font-size:12px;margin:0 0 20px}.inspect h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#74818d;margin:20px 0 8px}.inspect ul{margin:0;padding-left:17px;color:#465363;font-size:12px}.inspect li{margin:6px 0}.flow{display:flex;gap:6px;flex-wrap:wrap}.flow span{font-size:10px;background:#f1f4f5;border:1px solid #e1e7e9;padding:5px 8px;border-radius:8px}.callout{border-left:3px solid #6ab5a7;background:#f0f7f5;padding:11px 12px;border-radius:0 10px 10px 0;font-size:11px;color:#41534f;margin-top:16px}.mini{font-size:10px;color:var(--muted);margin-top:16px}.editable[contenteditable=true]{outline:2px dashed #8fc6b8;outline-offset:2px}.edit-toggle{font-size:11px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:white;color:#536171;cursor:pointer}.sources{font-size:10px;color:#64717d;border-top:1px solid var(--line);margin-top:18px;padding-top:14px}.source-list{line-height:1.7}@media(max-width:950px){.shell{grid-template-columns:190px minmax(300px,375px);justify-content:center}.inspect{grid-column:1/-1;position:static;max-height:none}.nav{position:static}}@media(max-width:620px){.top{padding:0 16px}.top small{display:none}.shell{display:flex;flex-direction:column;padding:12px;gap:12px}.nav{width:100%;overflow:auto;white-space:nowrap;padding:10px}.nav button{display:inline-flex;width:auto}.eyebrow{margin-bottom:6px}.phone-wrap{width:100%}.phone{height:740px;max-width:390px;min-height:650px}.inspect{width:100%}}
</style></head><body>
<header class="top"><div class="brand">neuro<b>balance</b> <small style="font-weight:500">/ mobile wireframe</small></div><div><small>Android-first · student wellness · concept prototype</small></div><button class="edit-toggle" id="edit">✎ Edit labels</button></header>
<main class="shell"><nav class="nav panel" id="nav"><div class="eyebrow">Screens · 10</div></nav><div class="phone-wrap"><section class="phone" aria-label="Android mobile app preview"><div class="status"><span>9:41</span><span>◔ ▮ ▰</span></div><div class="appbar"><button class="iconbtn" id="back" aria-label="Previous screen">‹</button><strong id="apptitle">NeuroBalance</strong><button class="iconbtn" aria-label="Settings">•••</button></div><div class="content" id="screen"></div><nav class="bottom"><button class="sel" data-go="3"><b>⌂</b>Home</button><button data-go="4"><b>◷</b>Focus</button><button data-go="9"><b>✦</b>Offline</button><button data-go="10"><b>▥</b>Report</button></nav></section></div><aside class="inspect panel" id="inspect"></aside></main>
<script>
const screens=[
{title:'Welcome & goals',label:'Onboarding',desc:'Start with the student’s priorities. Permission education comes before any Android settings handoff.',body:`<p class="hello">A little more balance, one step at a time</p><h1 class="title">Make room for<br>what matters.</h1><p class="sub">Small habits can make phone time feel more intentional.</p><div class="card tint"><span class="badge">YOUR PLAN, YOUR CHOICE</span><p class="label" style="margin:12px 0 5px">What would you like to work on?</p><p class="small">Choose up to three. You can change these anytime.</p><div class="chips"><button class="chip on">◎ Focus</button><button class="chip">☾ Sleep</button><button class="chip">♡ Feel calmer</button><button class="chip">▤ Remember</button></div></div><div class="card"><div class="row"><div><b class="label">Your data stays on this device</b><div class="small">No account needed to get started.</div></div><span>⌑</span></div></div><button class="btn" data-next="1">Set up my plan →</button><p class="small" style="text-align:center">Wellness support, not a medical tool.</p>`,hierarchy:['App bar: back, product name, settings','Goal selection: up to three selectable chips','Privacy summary card','Primary action: begin permission setup'],interactions:['Tap goal chips to select/deselect (limit three).','Continue to review each permission before Android settings.','Settings opens data controls and consent choices.'],note:'Ask consent separately for usage access and notification reading. Explain the exact data collected and that the app works without optional permissions.',next:'Permission choices'},
{title:'Permissions & consent',label:'Permissions',desc:'Plain-language, opt-in permissions with separate controls and an easy skip path.',body:`<p class="hello">Step 1 of 2 · Set up your plan</p><h1 class="title">Choose what<br>to share.</h1><p class="sub">NeuroBalance uses these signals to spot patterns. They stay on your phone.</p><div class="stepper"><i class="on"></i><i></i><i></i></div><div class="choice sel"><div class="tick">✓</div><div><strong>App use & pickups</strong><span>Screen time, opens and app switches</span></div></div><div class="choice"><div class="tick"></div><div><strong>Notification count</strong><span>Counts only. Message contents are never read.</span></div></div><div class="card blue"><b class="label">You’re in control</b><p class="small">Android will ask separately. You can skip, revoke access, or delete local history in Settings.</p></div><button class="btn" data-next="2">Continue to Android settings</button><button class="btn ghost" data-next="2">Skip for now</button>`,hierarchy:['Progress indicator','Separate permission cards with data-use description','Privacy and revocation note','Continue and skip actions'],interactions:['Toggle each consent independently.','Continue opens the corresponding Android permission explanation/settings.','Skip leads to baseline setup with manual check-ins only.'],note:'Permission is specific, reversible and optional. Never imply access is required to use the wellness exercises.',next:'Baseline week'},
{title:'Baseline week',label:'Baseline week',desc:'A quiet observation period records patterns and does not activate blockers or nudges.',body:`<p class="hello">Your first 7 days</p><h1 class="title">First, we’ll just<br>notice patterns.</h1><p class="sub">No limits or nudges this week. Your routines are already enough to start.</p><div class="card tint"><div class="row"><b class="label">Observation week</b><span class="badge">DAY 1 OF 7</span></div><div class="week"><div class="day done">M</div><div class="day">T</div><div class="day">W</div><div class="day">T</div><div class="day">F</div><div class="day">S</div><div class="day">S</div></div><div class="small">Today’s data is processing on this device.</div></div><div class="card"><b class="label">We’ll observe</b><div class="goal"><span class="dot">◷</span><div class="goalcopy"><b>Screen time & pickups</b><span>Daily totals and unlock patterns</span></div></div><div class="goal"><span class="dot">↔</span><div class="goalcopy"><b>App switches</b><span>How often apps change in short periods</span></div></div><div class="goal"><span class="dot">☾</span><div class="goalcopy"><b>Late-night use</b><span>Only if usage access is enabled</span></div></div></div><button class="btn" data-next="3">Explore today’s tools</button>`,hierarchy:['Day counter and seven-day timeline','Observation scope list','No-intervention reassurance','Explore tools action'],interactions:['Timeline updates each day.','Explore opens Home; observation continues quietly.','Permission status remains accessible from Settings.'],note:'Baseline is descriptive, not an evaluation. All observations stay local and do not infer brain state.',next:'Home dashboard'},
{title:'Home',label:'Home dashboard',desc:'A calm landing screen with a habit indicator, a simple brain-map illustration and three small suggestions.',body:`<p class="hello">Tuesday, 14 May · Good afternoon</p><h1 class="title">You’re finding<br>your rhythm.</h1><p class="sub">A few small choices can add up. Pick what fits today.</p><div class="card"><div class="row"><div><b class="label">Balance habits</b><div class="small">Your habit indicator · this week</div></div><b style="font-size:22px;color:#2d776e">68</b></div><div class="progress"><i style="width:68%"></i></div><div class="small">A reflection of habits you logged, not a brain scan or medical measure.</div></div><div class="brain"><svg viewBox="0 0 200 145" role="img" aria-label="Illustrative brain map with focus, memory, calm and sleep regions"><path d="M100 22c-12-16-38-14-46 3-21-1-31 20-23 36-15 17-7 39 10 46 0 20 20 31 37 23 11 14 27 12 34 3 7 9 23 11 34-3 17 8 37-3 37-23 17-7 25-29 10-46 8-16-2-37-23-36-8-17-34-19-46-3z" fill="#f8fbfd" stroke="#aebcc8" stroke-width="2"/><path d="M100 24v106M54 32c17 9 18 21 11 34-8 13-6 26 2 39M146 32c-17 9-18 21-11 34 8 13 6 26-2 39" fill="none" stroke="#c2ccd5" stroke-width="1.5"/><circle cx="67" cy="55" r="9" fill="#edcdb3"/><circle cx="132" cy="57" r="10" fill="#d4d0ef"/><circle cx="74" cy="99" r="9" fill="#d8e9dd"/><circle cx="126" cy="101" r="9" fill="#d7e9e8"/></svg><span class="brain-note">Illustrative habit map · not measured brain activity</span></div><div class="card"><div class="row"><b class="label">A few ideas for today</b><span class="small">Personalized</span></div><div class="goal"><span class="dot">◎</span><div class="goalcopy"><b>Try a 20-minute focus block</b><span>Focus Guard · Prefrontal cortex habits</span></div><button class="check" data-next="4">›</button></div><div class="goal"><span class="dot">☾</span><div class="goalcopy"><b>Give your evening a softer landing</b><span>Sleep Shield · Wind down gently</span></div><button class="check" data-next="9">›</button></div><div class="goal"><span class="dot">▤</span><div class="goalcopy"><b>Recall one thing before you search</b><span>Memory Mode · Retrieval practice</span></div><button class="check" data-next="6">›</button></div></div>`,hierarchy:['Greeting and supportive headline','Habit indicator card with caveat','Illustrative brain map with four habit regions','Three suggested goals mapped to modules','Persistent bottom navigation'],interactions:['Goal rows open the corresponding module.','Bottom tabs navigate Home, Focus, Offline logging and Weekly report.','Habit indicator details explain which logged habits contribute.'],note:'Score is explicitly a habit indicator, never brain function or diagnosis. Region mapping is a learning aid, not a claim that habits alter measured anatomy.',next:'Focus Guard'},
{title:'Focus Guard',label:'Focus Guard',desc:'A user-started focus block with an optional phone-down prompt and supportive finish state.',body:`<p class="hello">FOCUS GUARD · ATTENTION HABITS</p><h1 class="title">One thing at<br>a time.</h1><p class="sub">Choose a short block that feels doable.</p><div class="card"><div class="row"><span class="label">Focus duration</span><span class="small">20 minutes</span></div><div class="slider"></div><div class="row small"><span>10 min</span><span>45 min</span></div><div class="choice sel"><div class="tick">✓</div><div><strong>Quiet notifications</strong><span>Pause selected alerts for this session</span></div></div><div class="choice"><div class="tick"></div><div><strong>Phone-down reminder</strong><span>A gentle prompt to place your phone aside</span></div></div></div><div class="card lav"><b class="label">Why this may help</b><p class="small">Fewer interruptions can make it easier to stay with a task. Research findings describe associations and do not prove a cause for every person.</p></div><button class="btn" data-start="focus">Start focus · 20:00</button><button class="btn ghost" data-next="3">Maybe later</button>`,hierarchy:['Duration selector','Optional notification pause and phone-down choices','Short research explanation','Start and dismiss actions'],interactions:['Adjust duration from 10–45 minutes.','Optional settings apply only during this session and can be ended anytime.','Start opens an active timer and gentle completion screen.'],note:'Android notification controls require user authorization. Never block emergency alerts or make the user feel punished for leaving a session.',next:'Reward Balance'},
{title:'Reward Balance',label:'Reward Balance',desc:'A lightweight pause before a chosen app, ending with a freely chosen open or redirect.',body:`<p class="hello">A MOMENT TO CHOOSE</p><h1 class="title">Before you open<br>Social…</h1><p class="sub">A short pause can help you choose what you want from this moment.</p><div class="card peach" style="text-align:center;padding:20px"><div style="font-size:29px">◉</div><div class="timer" style="font-size:27px">Pause · 10 sec</div><div class="small">Take one breath. No rush.</div></div><div class="card"><b class="label">What would feel good right now?</b><div class="chips" style="margin-top:10px"><button class="chip">Message a friend</button><button class="chip">Take a break</button><button class="chip">Open Social</button></div></div><button class="btn" data-next="3">Continue to Social</button><button class="btn ghost" data-next="9">Choose an offline moment</button><p class="small" style="text-align:center">You can always continue. This is your choice.</p>`,hierarchy:['Contextual app-open pause','Optional intention chips','Clear continue action','Optional offline redirect'],interactions:['Pause can be skipped; no app is blocked.','Choose an intention or continue directly.','Optional grayscale quick setting is user-controlled.'],note:'Pattern support is opt-in and non-coercive. Pickup counts describe behavior, not an addiction or diagnosis.',next:'Memory Mode'},
{title:'Memory Mode',label:'Memory Mode',desc:'A quick retrieval-practice card that invites recall before revealing the answer.',body:`<p class="hello">MEMORY MODE · HIPPOCAMPUS HABITS</p><h1 class="title">Try remembering<br>before searching.</h1><p class="sub">A tiny retrieval practice, whenever it suits you.</p><div class="card lav"><div class="row"><span class="badge">QUICK RECALL</span><span class="small">1 of 3</span></div><div class="flash"><span class="small">BIOLOGY · CELL ENERGY</span><p>Pause and recall:</p><b>What does a mitochondrion do?</b><div class="small" style="margin-top:12px">Take a moment to think of your answer.</div></div><button class="btn secondary" id="reveal">Reveal answer</button><p class="small" id="answer" hidden>It helps release usable energy from nutrients for the cell.</p></div><div class="row"><button class="btn ghost" style="width:49%" data-next="3">Done</button><button class="btn" style="width:49%" data-next="3">Next card →</button></div><p class="small">You can also try a familiar route without GPS, if it feels safe and appropriate.</p>`,hierarchy:['Deck progress label','Recall prompt and answer reveal','Next/done actions','Optional safe navigation challenge hint'],interactions:['Reveal answer after trying recall.','Next advances the short flashcard deck.','Exit at any time; no performance score.'],note:'Retrieval practice is a learning strategy. The “Google effect” research is presented as an observed association in particular study settings, not evidence that searching harms memory.',next:'Calm Zone'},
{title:'Calm Zone',label:'Calm Zone',desc:'A brief guided breathing exercise offered as an invitation, not a mental-health assessment.',body:`<p class="hello">CALM ZONE · A ONE-MINUTE PAUSE</p><h1 class="title">Let’s slow<br>this moment.</h1><p class="sub">If it feels comfortable, follow a gentle breath. You can stop anytime.</p><div class="breath">Breathe in<br><span class="small">for 4</span></div><div class="card"><div class="row"><span class="label">Breathing pace</span><span class="small">Gentle · 1 minute</span></div><div class="progress"><i style="width:30%"></i></div><div class="small">No need to change your breath. Choose a pace that feels okay.</div></div><button class="btn" data-start="breathing">Begin breathing break</button><button class="btn ghost" data-next="3">Skip for now</button><p class="small" style="text-align:center">This exercise is optional and is not a substitute for support.</p>`,hierarchy:['Reassuring title and consent framing','Breath circle and pace indicator','Begin and skip controls','Wellness scope note'],interactions:['Begin starts a short inhale/exhale animation.','Stop or skip immediately at any time.','No mood inference or late-night distress labeling.'],note:'Do not infer emotions from device behavior. The suggested pause is a gentle option based on a user-selected preference or local rule.',next:'Sleep Shield'},
{title:'Sleep Shield',label:'Sleep Shield',desc:'A bedtime routine card with optional reminder and warm display settings under user control.',body:`<p class="hello">SLEEP SHIELD · WIND-DOWN ROUTINE</p><h1 class="title">Make evenings<br>a little softer.</h1><p class="sub">Pick a wind-down time that works for your real life.</p><div class="card blue"><div class="row"><div><b class="label">Your wind-down</b><div class="small">Suggested · change anytime</div></div><strong style="font-size:22px">9:45 <small style="font-size:11px">PM</small></strong></div><div class="progress"><i style="width:72%"></i></div><div class="small">About 45 minutes before your usual bedtime</div></div><div class="choice sel"><div class="tick">✓</div><div><strong>Gentle reminder</strong><span>Only on school nights</span></div></div><div class="choice"><div class="tick"></div><div><strong>Warm screen tint</strong><span>Use Android display setting</span></div></div><div class="card"><b class="label">Why wind down?</b><p class="small">Evening light and late screen use have been associated with sleep timing and next-day alertness. This varies by person; this is a habit tip, not a health assessment.</p></div><button class="btn" data-next="3">Save my routine</button><button class="btn ghost" data-next="3">Not now</button>`,hierarchy:['Editable wind-down time','Optional reminder and tint toggles','Research explanation','Save or dismiss actions'],interactions:['Change suggested time.','Choose school nights and reminder type.','Warm tint opens Android display settings only with confirmation.'],note:'Avoid claiming all screen light has the same effect or that the routine treats sleep problems. No bedtime use is required for app scoring.',next:'Real-World Streak'},
{title:'Real-World Streak',label:'Real-World Streak',desc:'A private, self-reported offline activity log that celebrates showing up without requiring proof.',body:`<p class="hello">REAL-WORLD STREAK · OFFLINE MOMENTS</p><h1 class="title">Life beyond the<br>screen counts.</h1><p class="sub">Log a moment you enjoyed. No tracking or proof needed.</p><div class="card tint"><div class="row"><b class="label">Your week</b><span class="badge">3 DAY STREAK</span></div><div class="week"><div class="day done">M<br>✓</div><div class="day done">T<br>✓</div><div class="day done">W<br>✓</div><div class="day">T</div><div class="day">F</div><div class="day">S</div><div class="day">S</div></div><div class="small">A streak is a celebration, not a rule. It’s always okay to start again.</div></div><div class="card"><b class="label">What did you do?</b><div class="chips" style="margin-top:11px"><button class="chip">📖 Read</button><button class="chip">🏃 Move</button><button class="chip">☻ In-person time</button><button class="chip">🌿 Something else</button></div><div class="small" style="margin-top:12px">Optional · This stays on your device</div></div><button class="btn" id="log">Log this moment</button><button class="btn ghost" data-next="3">Maybe later</button>`,hierarchy:['Weekly streak calendar','Non-punitive streak explanation','Offline activity selection','Private self-log action'],interactions:['Choose one or more activity types.','Log records only a timestamp and selected category locally.','Skip without losing progress or seeing a shame message.'],note:'Do not use sensors, location, camera or social comparison to verify offline activity. Friend challenges are optional and off by default.',next:'Weekly report'},
{title:'Weekly report',label:'Weekly report',desc:'The weekly view ties logged habits to learning-focused brain-region labels and transparent research notes.',body:`<p class="hello">YOUR WEEK · MAY 8–14</p><h1 class="title">Small steps<br>showing up.</h1><p class="sub">Your habits this week, gathered on this device.</p><div class="card"><div class="row"><div><b class="label">Balance habits</b><div class="small">Habit indicator · not a medical measure</div></div><b style="font-size:22px;color:#2d776e">68 <span style="font-size:11px">↑ 8</span></b></div><div class="progress"><i style="width:68%"></i></div><div class="small">Based on routines you chose and logged. No brain activity is measured.</div></div><div class="card"><b class="label">Habit map · this week</b><div class="goal"><span class="dot">◎</span><div class="goalcopy"><b>Attention habits · 4 focus blocks</b><span>Prefrontal cortex & anterior cingulate</span></div><span class="badge">+2</span></div><div class="goal"><span class="dot">▤</span><div class="goalcopy"><b>Recall practice · 3 sessions</b><span>Hippocampus · memory strategies</span></div><span class="badge">+1</span></div><div class="goal"><span class="dot">☾</span><div class="goalcopy"><b>Wind-downs · 3 evenings</b><span>Hypothalamus · sleep-wake timing</span></div><span class="badge">+1</span></div><div class="goal"><span class="dot">♡</span><div class="goalcopy"><b>Offline moments · 3 logs</b><span>Whole-brain wellbeing habits</span></div><span class="badge">+1</span></div></div><div class="card lav"><b class="label">What research can tell us</b><p class="small">Studies have reported associations between digital habits, attention, memory, mood and sleep. These findings do not prove that technology alone causes brain changes, and this app does not measure brain health.</p><button class="btn secondary" id="sources">See research notes & sources</button><div class="sources" id="sourcebox" hidden><b>Research notes (from the project brief)</b><div class="source-list">Attention: Ophir et al. (2009); Ward et al. (2017); Kushlev et al. (2016).<br>Reward: Sherman et al. (2016). Memory: Sparrow et al. (2011).<br>Mood: Hunt et al. (2018). Sleep: Chang et al. (2015).<br>White matter association in preschool children: Hutton et al. (2020).</div></div></div><div class="card"><b class="label">How did this week feel?</b><div class="rating" style="margin-top:10px"><button>Hard</button><button>Okay</button><button>Good</button></div></div><button class="btn" data-next="3">Choose next week’s goals</button>`,hierarchy:['Habit indicator and week-over-week change','Habit-to-region progress list','Research caveat and expandable citations','Optional user reflection','Next-week goal action'],interactions:['Region rows explain the associated habit and study note.','Research notes expand with cited sources from the brief.','Rating stays local and optional; it is not a clinical measure.','Next-week action returns to goal selection.'],note:'Use “habit progress” and “research associations”; avoid “brain improvement” or causal claims. White-matter evidence cited in the brief is from preschool-aged children, not teens.',next:'Home dashboard'}
];
let current=0;const nav=document.getElementById('nav');
screens.forEach((s,i)=>{let b=document.createElement('button');b.type='button';b.dataset.screen=i;b.innerHTML='<span class="num">'+String(i+1).padStart(2,'0')+'</span>'+s.label;b.onclick=()=>show(i);nav.appendChild(b)});
function show(i){current=(i+screens.length)%screens.length;let s=screens[current];document.getElementById('screen').innerHTML=s.body;document.getElementById('apptitle').textContent=s.title;document.querySelectorAll('#nav button').forEach((b,j)=>b.classList.toggle('active',j===current));document.getElementById('inspect').innerHTML='<div class="eyebrow">Screen '+String(current+1).padStart(2,'0')+' / '+screens.length+'</div><h2>'+s.title+'</h2><p class="desc">'+s.desc+'</p><h3>Component hierarchy</h3><ul>'+s.hierarchy.map(x=>'<li>'+x+'</li>').join('')+'</ul><h3>Interactions</h3><ul>'+s.interactions.map(x=>'<li>'+x+'</li>').join('')+'</ul><div class="callout"><b>Design note</b><br>'+s.note+'</div><h3>Flow</h3><div class="flow"><span>'+s.label+'</span><span>→ '+s.next+'</span></div><h3>Design rationale</h3><p class="desc">Teen-friendly, low-pressure language and clear choices make habit changes feel manageable. Consistent bottom navigation keeps the six short tools easy to reach; local-first controls make privacy visible.</p><div class="mini">Concept wireframe · Android-first · positive, user-controlled language</div>';document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>show(Number(b.dataset.next)));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(Number(b.dataset.go)));document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>b.classList.toggle('on'));document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{b.classList.toggle('sel');b.querySelector('.tick').textContent=b.classList.contains('sel')?'✓':''});document.getElementById('reveal')?.addEventListener('click',()=>document.getElementById('answer').hidden=false);document.getElementById('sources')?.addEventListener('click',()=>document.getElementById('sourcebox').hidden=!document.getElementById('sourcebox').hidden);document.getElementById('log')?.addEventListener('click',e=>{e.currentTarget.textContent='Moment logged ✓';e.currentTarget.classList.add('secondary')});document.querySelectorAll('.rating button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.rating button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{b.textContent=b.dataset.start==='focus'?'Focus session started · 20:00':'Breathing break started';b.classList.add('secondary')})}
document.getElementById('back').onclick=()=>show(current-1);document.getElementById('edit').onclick=()=>{let on=document.body.classList.toggle('editing');document.querySelectorAll('.content,.inspect').forEach(x=>{x.contentEditable=on?'true':'false'});document.getElementById('edit').textContent=on?'✓ Done editing':'✎ Edit labels'};show(0);
</script></body></html>
